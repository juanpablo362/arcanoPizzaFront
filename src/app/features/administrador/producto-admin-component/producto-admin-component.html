<div class="container-fluid p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="logo border p-2">LOGO</div>
    <div class="user d-flex align-items-center">
      <i class="bi bi-person-circle me-2"></i>
      Juan Mendoza
      <button class="btn btn-outline-secondary btn-sm ms-2"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </div>

  <!-- Navigation -->
<div class="mb-4">
  <button class="btn btn-outline-primary me-2" routerLink="/dashboard">Dashboard</button>
  <button class="btn btn-outline-primary me-2" routerLink="/productos">Productos</button>
  <button class="btn btn-outline-primary" routerLink="/admin">Usuarios</button>
</div>

  <!-- Resumen -->
  <div class="mb-4 d-flex gap-3">
    <div class="card p-3 flex-fill text-center">
      <div>Total Usuarios</div>
      <div class="fs-4 fw-bold">{{ totalUsuarios }}</div>
    </div>
    <div class="card p-3 flex-fill text-center text-success">
      <div>Empleados</div>
      <div class="fs-4 fw-bold">{{ totalEmpleados }}</div>
    </div>
    <div class="card p-3 flex-fill text-center text-danger">
      <div>Administradores</div>
      <div class="fs-4 fw-bold">{{ totalAdministradores }}</div>
    </div>
    <div class="card p-3 flex-fill text-center text-purple">
      <div>Usuarios Activos</div>
      <div class="fs-4 fw-bold">{{ totalActivos }}</div>
    </div>

    <button class="btn btn-outline-primary ms-auto" (click)="abrirModalUsuario()">+ Nuevo Usuario</button>
  </div>

  <!-- Lista -->
  <div class="card p-3">

    <div *ngFor="let usuario of usuariosFiltrados()" class="d-flex justify-content-between border-top p-2">

      <div>
        <strong>{{ usuario.nombre }}</strong>
        <span class="badge bg-success" *ngIf="usuario.tipo==='Empleado'">Empleado</span>
        <span class="badge bg-danger" *ngIf="usuario.tipo==='Administrador'">Admin</span>
        <span class="badge bg-success" *ngIf="usuario.activo">Activo</span>

        <div class="text-muted">{{ usuario.email }}</div>
      </div>

      <div>
        <button class="btn btn-sm btn-secondary" (click)="abrirEditar(usuario)">
          <i class="bi bi-pencil"></i>
        </button>

        <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(usuario)">
          <i class="bi bi-trash"></i>
        </button>
      </div>

    </div>

  </div>

</div>


<!-- MODAL NUEVO -->
<div class="modal fade" id="modalUsuario">
  <div class="modal-dialog">
    <div class="modal-content p-3">

      <h5>Nuevo Usuario</h5>

      <input class="form-control mb-2" [(ngModel)]="nuevoUsuario.nombre">
      <input class="form-control mb-2" [(ngModel)]="nuevoUsuario.email">
      <input class="form-control mb-2" [(ngModel)]="nuevoUsuario.telefono">

      <select class="form-control mb-3" [(ngModel)]="nuevoUsuario.tipo">
        <option>Empleado</option>
        <option>Administrador</option>
      </select>

      <div class="text-end">
        <button class="btn btn-secondary" (click)="cerrarModalUsuario()">Cancelar</button>
        <button class="btn btn-danger" (click)="crearUsuario()">Crear</button>
      </div>

    </div>
  </div>
</div>

<!-- MODAL EDIT -->
<div class="modal fade" id="modalEditarUsuario">
  <div class="modal-dialog">
    <div class="modal-content p-3">

      <h5>Editar</h5>

      <input class="form-control mb-2" [(ngModel)]="usuarioEdit.nombre">
      <input class="form-control mb-2" [(ngModel)]="usuarioEdit.email">

      <div class="text-end">
        <button class="btn btn-secondary" (click)="cerrarEditar()">Cancelar</button>
        <button class="btn btn-danger" (click)="guardarCambios()">Guardar</button>
      </div>

    </div>
  </div>
</div>
