<div class="page-container">
  <nav class="navbar">
    <div class="logo">LOGO</div>
    <div class="nav-links">
      <a href="#">Inicio</a>
      <a href="#" class="active-link">Menú</a>
      <a (click)="irAPromociones()" style="cursor: pointer;">Promociones</a>
      <a href="#" class="active-link">Contacto</a>
    </div>
    <div class="auth">
      <a href="#" class="active-link">Iniciar sesión</a>
    </div>
  </nav>

  <div class="category-filters">
    @for (cat of categorias; track cat) {
      <button 
        class="filter-btn" 
        [class.active]="categoriaActiva === cat"
        (click)="seleccionarCategoria(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <div class="products-grid">
    @for (producto of productosFiltrados; track producto.id) {
      <div class="product-card" (click)="abrirDetalle(producto)" style="cursor: pointer;">
        
        <img [src]="producto.imagen" [alt]="'Pizza ' + producto.nombre">
        
        <div class="card-body">
          <div class="card-header">
            <h3 class="pizza-title">{{ producto.nombre }}</h3>
            <span class="pizza-price">${{ producto.precio | number:'1.2-2' }} MXN</span>
          </div>
          <p class="pizza-desc">{{ producto.descripcion }}</p>
        </div>

      </div>
    }
  </div>
</div>
