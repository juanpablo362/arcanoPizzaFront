<nav class="navbar">
  <div class="navbar-start">
    <a routerLink="/menu-clientes-component" class="logo-link" aria-label="Arcano Pizza — ir al menú">
      <img src="/img/arcanologo.png" alt="Arcano Pizza" class="logo-img" width="160" height="48" />
    </a>
  </div>
  <div class="nav-links">
    <a routerLink="/menu-clientes-component" routerLinkActive="active-link">Menú</a>
    <a routerLink="/promociones" routerLinkActive="active-link">Promociones</a>
    <a routerLink="/contacto" routerLinkActive="active-link">Contacto</a>
    <a routerLink="/pedidos" routerLinkActive="active-link">Pedidos</a>
    <a routerLink="/extras" routerLinkActive="active-link">Extras</a>
  </div>
  <div class="auth">
    @if (auth.isAuthenticated()) {
      <button type="button" class="nav-btn-link" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/auth" routerLinkActive="active-auth" [routerLinkActiveOptions]="{ exact: false }"
        >Iniciar sesión</a
      >
    }
  </div>
</nav>
